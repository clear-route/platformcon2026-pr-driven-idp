name: CI

on:
  push:
    tags:
      - '**'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate image tag (short SHA)
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="$GITHUB_SHA"
          fi

          SHORT_SHA=${SHA:0:7}
          echo "image-tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  discover-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
      app-env: ${{ steps.set-env.outputs.app-env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set target environment
        id: set-env
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "app-env=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "app-env=preview" >> "$GITHUB_OUTPUT"
          else
            echo "app-env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed application directories
        id: changed-files
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v47
        with:
          files: applications/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Build matrix
        id: build-matrix
        shell: bash
        env:
          ALL_CHANGED_DIRS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            dockerfiles=$(find applications -path "*/src/Dockerfile" | sort)
          else
            candidates=""
            for dir in $ALL_CHANGED_DIRS; do
              while IFS= read -r dockerfile; do
                candidates="$candidates"$'\n'"$dockerfile"
              done < <(find "$dir" -path "*/src/Dockerfile" 2>/dev/null)
            done
            dockerfiles=$(echo "$candidates" | sort -u | grep -v '^$' || true)
          fi

          if [[ -z "$dockerfiles" ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix=$(echo "$dockerfiles" | while IFS= read -r dockerfile; do
            [[ -z "$dockerfile" ]] && continue
            app=$(echo "$dockerfile" | cut -d/ -f2)
            echo "{\"app\":\"$app\",\"dockerfile\":\"$dockerfile\"}"
          done | jq -sc '{"include": .}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [determine-version, discover-apps]
    if: needs.discover-apps.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/platformcon2026-demo-${{ needs.discover-apps.outputs.app-env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          context: applications/${{ matrix.app }}/src
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.app }}-${{ needs.discover-apps.outputs.app-env }}:${{ needs.determine-version.outputs.image-tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.app }}-${{ needs.discover-apps.outputs.app-env }}:latest
