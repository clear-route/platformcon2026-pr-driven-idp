name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

permissions:
  contents: write
  id-token: write

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semrel.outputs.new_release_published }}
      new-release-version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        if: github.event_name == 'push'
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  discover-apps:
    runs-on: ubuntu-latest
    needs: [semantic-release]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
      app-env: ${{ steps.set-env.outputs.app-env }}
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set target environment
        id: set-env
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "app-env=preview" >> "$GITHUB_OUTPUT"
          else
            echo "app-env=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: set-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            echo "image-tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ needs.semantic-release.outputs.new-release-version }}" ]]; then
            echo "image-tag=${{ needs.semantic-release.outputs.new-release-version }}" >> "$GITHUB_OUTPUT"
          else
            echo "image-tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed application directories
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47
        with:
          files: applications/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Build matrix
        id: build-matrix
        shell: bash
        env:
          ALL_CHANGED_DIRS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ needs.semantic-release.outputs.new-release-published }}" != "true" ]]; then
              echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "has-changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            dockerfiles=$(find applications -path "*/src/Dockerfile" | sort)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            dockerfiles=$(find applications -path "*/src/Dockerfile" | sort)
          else
            candidates=""
            for dir in $ALL_CHANGED_DIRS; do
              while IFS= read -r dockerfile; do
                candidates="$candidates"$'\n'"$dockerfile"
              done < <(find "$dir" -path "*/src/Dockerfile" 2>/dev/null)
            done
            dockerfiles=$(echo "$candidates" | sort -u | grep -v '^$' || true)
          fi

          if [[ -z "$dockerfiles" ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix=$(echo "$dockerfiles" | while IFS= read -r dockerfile; do
            [[ -z "$dockerfile" ]] && continue
            app=$(echo "$dockerfile" | cut -d/ -f2)
            echo "{\"app\":\"$app\",\"dockerfile\":\"$dockerfile\"}"
          done | jq -sc '{"include": .}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [discover-apps]
    if: needs.discover-apps.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/platformcon2026-demo-${{ needs.discover-apps.outputs.app-env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          context: applications/${{ matrix.app }}/src
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.app }}-${{ needs.discover-apps.outputs.app-env }}:${{ needs.discover-apps.outputs.image-tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.app }}-${{ needs.discover-apps.outputs.app-env }}:latest
