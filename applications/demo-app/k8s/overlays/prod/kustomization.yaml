apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/clear-route/platformcon2026-pr-driven-idp//applications/demo-app/k8s/base?ref=396b6677c3e87af2bd0c65bd71b4abc754db51dc

labels:
  - pairs:
      app: demo-app
      allow-ingress-traefik: "true"
    includeSelectors: true

images:
  - name: clearroute/demo-app-frontend
    newName: 799468650620.dkr.ecr.ap-southeast-2.amazonaws.com/demo-app-frontend-dev
    newTag: latest

replacements:
  - sourceValue: demo-app-dev.dev.clearroute.io
    targets:
      - select:
          kind: Ingress
          name: demo-app
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
          - spec.rules.0.host
          - spec.tls.0.hosts.0
        options:
          create: true
