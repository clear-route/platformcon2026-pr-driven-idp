apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/clear-route/platformcon2026-pr-driven-idp//applications/demo-app/k8s/base?ref=v0.5.2

labels:
  - pairs:
      app: demo-app
      env: prod
      allow-ingress-traefik: "true"
    includeSelectors: true

images:
  - name: clearroute/demo-app
    newName: 799468650620.dkr.ecr.ap-southeast-2.amazonaws.com/demo-app-prod
    newTag: v0.5.3

replacements:
  - sourceValue: demo-app-prod.dev.clearroute.io
    targets:
      - select:
          kind: Ingress
          name: demo-app
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
          - spec.rules.0.host
          - spec.tls.0.hosts.0
        options:
          create: true
