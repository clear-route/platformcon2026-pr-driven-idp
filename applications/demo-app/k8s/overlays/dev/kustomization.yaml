apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app: demo-app
      env: dev
      allow-ingress-traefik: "true"
    includeSelectors: true

images:
  - name: clearroute/demo-app
    newName: 799468650620.dkr.ecr.ap-southeast-2.amazonaws.com/demo-app-dev
    newTag: latest

replacements:
  - sourceValue: demo-app-dev.dev.clearroute.io
    targets:
      - select:
          kind: Ingress
          name: demo-app
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
          - spec.rules.0.host
          - spec.tls.0.hosts.0
        options:
          create: true
